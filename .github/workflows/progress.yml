name: progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the denominator check compares with the base commit's history

      - name: Audit public repository and reachable history (ROM-free)
        run: python3 tools/audit_public.py --history --no-rom

      - uses: astral-sh/setup-uv@v6

      - name: Install locked Python tooling
        run: uv sync --locked

      - name: Validate configuration JSON
        run: |
          for f in config/*.json config/*/*.json toolchain.lock.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Verify the recorded denominator (catalogues, classification, data units; append-only)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE:docs/denominator-history.jsonl" 2>/dev/null; then
            git show "$BASE:docs/denominator-history.jsonl" > "$RUNNER_TEMP/base-history.jsonl"
            python3 tools/denominator.py verify --base "$RUNNER_TEMP/base-history.jsonl"
          else
            python3 tools/denominator.py verify
          fi

      # No ROM and no binutils in CI: synthetic analyzer/ROM tests run, toolchain and real-ROM
      # tests skip themselves.
      - name: Tests
        run: uv run python -m unittest discover -s tests -v

      - name: Generate objdiff progress reports (REV 02 primary, REV 00 from the same source)
        run: |
          mkdir -p reports/rev02 reports/rev00
          python3 ci/progress_report.py --version rev02 --output reports/rev02/report.json --summary "$GITHUB_STEP_SUMMARY"
          python3 ci/progress_report.py --version rev00 --output reports/rev00/report.json --summary "$GITHUB_STEP_SUMMARY"

      # ByteMatch reads the <version>_report artifacts: default-branch push runs feed its history,
      # pull request runs feed its PR comments (docs/BYTEMATCH.md).
      - name: Upload REV 02 progress report
        uses: actions/upload-artifact@v4
        with:
          name: rev02_report
          path: reports/rev02/report.json

      - name: Upload REV 00 progress report
        uses: actions/upload-artifact@v4
        with:
          name: rev00_report
          path: reports/rev00/report.json
